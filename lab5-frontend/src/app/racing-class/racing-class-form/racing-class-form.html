<section class="panel">
  <h1>{{ classId ? 'Edycja klasy' : 'Nowa klasa wyścigowa' }}</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>Nazwa
      <input formControlName="name" />
    </label>
    <label>Maks. moc (KM)
      <input type="number" formControlName="maxHorsepower" />
    </label>
    <label>Min. masa (kg)
      <input type="number" formControlName="minWeight" />
    </label>

    <div class="actions">
      <a class="button" routerLink="/classes">Anuluj</a>
      <button type="submit" [disabled]="form.invalid">Zapisz</button>
    </div>
  </form>
</section>
