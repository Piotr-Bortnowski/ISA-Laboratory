services:
  racing-class-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: racing_class
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [racing-class-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  race-car-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: race_car
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [race-car-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  race-car-app:
    build: ./race-car-app
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://race-car-db:5432/race_car
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      race-car-db: { condition: service_healthy }

  racing-class-app:
    build: ./racing-class-app
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://racing-class-db:5432/racing_class
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RACE_CAR_URL: http://race-car-app:8082
    depends_on:
      racing-class-db: { condition: service_healthy }
      race-car-app: { condition: service_started }

  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      RACING_CLASS_URL: http://racing-class-app:8081
      RACE_CAR_URL: http://race-car-app:8082
    depends_on: [racing-class-app, race-car-app]

  frontend:
    build: ./lab5-frontend
    ports: ["4200:80"]
    environment:
      API_URL: http://gateway:8080
    depends_on: [gateway]

volumes:
  racing-class-data:
  race-car-data: