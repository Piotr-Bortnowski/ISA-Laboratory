x-race-car: &race-car
  build: ./race-car-app
  restart: on-failure            # jeśli config/eureka jeszcze nie wstały
  depends_on:
    race-car-db: { condition: service_healthy }
    config-server: { condition: service_started }
    discovery: { condition: service_started }

services:
  config-server: { build: ./config-server, ports: ["8888:8888"] }
  discovery:     { build: ./discovery,     ports: ["8761:8761"] }
  
  racing-class-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: racing_class
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [racing-class-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d racing_class"]
      interval: 5s
      retries: 10

  race-car-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: race_car
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [race-car-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d race_car"]
      interval: 5s
      retries: 10

  race-car-app-1:
    <<: *race-car
    environment: { CONFIG_SERVER_URL: http://config-server:8888, INSTANCE_ID: race-car-app-1 }
  race-car-app-2:
    <<: *race-car
    environment: { CONFIG_SERVER_URL: http://config-server:8888, INSTANCE_ID: race-car-app-2 }

  racing-class-app:
    build: ./racing-class-app
    restart: on-failure
    environment: { CONFIG_SERVER_URL: http://config-server:8888, INSTANCE_ID: racing-class-app-1 }
    depends_on:
      racing-class-db: { condition: service_healthy }
      config-server: { condition: service_started }
      discovery: { condition: service_started }

  gateway:
    build: ./gateway
    restart: on-failure
    ports: ["8080:8080"]
    environment: { CONFIG_SERVER_URL: http://config-server:8888, INSTANCE_ID: gateway-1 }
    depends_on:
      config-server: { condition: service_started }
      discovery: { condition: service_started }

  frontend:
    build: ./lab5-frontend
    ports: ["4200:80"]
    environment:
      API_URL: http://gateway:8080
    depends_on: [gateway]

volumes:
  racing-class-data:
  race-car-data: